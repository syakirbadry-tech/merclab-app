  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark)" href="ios-launch/launch-iphone-x-11pro-dark.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Merc Lab DMS">
  <title>Merc Lab DMS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="merclab.css">
  <link rel="stylesheet" href="splash.css">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="feedback.css">
  <link rel="stylesheet" href="bridge.css">
</head>
<body class="ml">
  <div class="ml-splash" id="ml-splash" role="status" aria-live="polite" aria-label="The Merc Lab is starting">
    <div class="ml-splash__grid" aria-hidden="true"></div>
    <div class="ml-splash__scan" aria-hidden="true"></div>
    <div class="ml-splash__glow" aria-hidden="true"></div>
    <div class="ml-splash__bloom" aria-hidden="true"></div>
    <div class="ml-splash__stage"><div class="ml-splash__beat">
      <svg class="ml-splash__logo" viewBox="0 0 300 104" role="img" aria-label="The Merc Lab, Independent Mercedes-Benz Specialist">
        <defs><clipPath id="ml-splash-merc"><rect x="-2" y="14" width="112" height="44"></rect></clipPath></defs>
        <g font-family="Arimo, Arial, Helvetica, sans-serif" font-weight="700">
          <text class="s-the ink" x="0" y="11" font-size="12" letter-spacing="6">THE</text>
          <g clip-path="url(#ml-splash-merc)"><text class="s-merc ink" x="0" y="50" font-size="36" letter-spacing="-0.36">MERC</text></g>
          <rect class="s-box ink" x="112" y="17" width="79" height="38"></rect>
          <text class="s-lab" x="119" y="50" font-size="36" letter-spacing="-0.36">LAB</text>
          <path class="s-trace" d="M0 64H136L143 59L150 69L157 58L164 70L171 64H294" pathLength="1"></path>
          <text class="s-tag ink" x="0" y="86" font-size="12" letter-spacing="0.72">INDEPENDENT MERCEDES-BENZ SPECIALIST</text>
        </g>
      </svg>
      <span class="ml-splash__ring" aria-hidden="true"></span>
      <span class="ml-splash__ring r2" aria-hidden="true"></span>
      <span class="ml-splash__dot" aria-hidden="true"></span>
    </div></div>
  </div>
  <script src="splash.js"></script>
  <div id="shell" hidden>
    <aside class="side" id="side" aria-label="Main menu"></aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="topbar">
        <button class="btn ghost icon menu-btn" id="menuBtn" aria-label="Open menu"></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="gsearch" role="search">
          <span id="gIcon"></span>
          <input id="gq" type="search" placeholder="Search plate, customer, EST / INV no" aria-label="Search" autocomplete="off">
          <div class="gres" id="gres" hidden></div>
        </div>
        <div class="me" aria-hidden="true">ML</div>
      </header>
      <main id="view" aria-live="polite"></main>
    </div>
    <nav class="bottom" id="bottom" aria-label="Quick menu"></nav>
  </div>
  <main class="ml login" id="login" hidden>
    <svg class="login__trace" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
      <path class="ln" pathLength="1" vector-effect="non-scaling-stroke" d="M0 60H180L192 52L204 72L216 34L228 82L240 60H1200"></path>
      <path class="pulse" pathLength="1" vector-effect="non-scaling-stroke" d="M0 60H180L192 52L204 72L216 34L228 82L240 60H1200"></path>
    </svg>
    <section class="login__card" aria-labelledby="login-title">
      <img class="login__logo ls" style="--i: 0" src="/brand/merc-lab-logo.svg" alt="The Merc Lab, Independent Mercedes-Benz Specialist" width="168" height="58">
      <h1 class="login__title ls" id="login-title" style="--i: 1">Welcome back</h1>
      <p class="login__sub ls" style="--i: 2">Sign in to the workshop system.</p>
      <form class="login__form ls" id="login-form" style="--i: 3" novalidate>
        <label for="login-pw">Password</label>
        <div class="login__pw">
          <input class="input" id="login-pw" name="password" type="password" autocomplete="current-password" required aria-describedby="login-msg">
          <button class="login__eye" id="login-eye" type="button" aria-label="Show password" aria-pressed="false">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <p class="login__msg" id="login-msg" role="alert" aria-live="polite"></p>
        <button class="btn lg block" id="login-go" type="submit">Sign in</button>
      </form>
    </section>
    <p class="login__foot">Independent Mercedes-Benz Specialist · DMS 1.1</p>
  </main>
  <div id="toast" role="status"></div>

  <script src="condition.js"></script>
  <script src="feedback.js"></script>
  <script src="hub-logic.js"></script>
  <script src="app.js"></script>
  <script src="alerts.js"></script>
  <script src="login.js"></script>
</body>
</html>
