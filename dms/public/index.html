<!doctype html>
<html lang="en" data-theme="light">
<head>
  <script>(function () { var m = window.matchMedia && matchMedia("(prefers-color-scheme: dark)"); var set = function () { document.documentElement.setAttribute("data-theme", m && m.matches ? "dark" : "light"); }; set(); if (m && m.addEventListener) m.addEventListener("change", set); })();</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1d22">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Merc Lab DMS">
  <title>Merc Lab DMS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="merclab.css">
  <link rel="stylesheet" href="bridge.css">
</head>
<body class="ml">
  <div id="shell" hidden>
    <aside class="side" id="side" aria-label="Main menu"></aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="topbar">
        <button class="btn ghost icon menu-btn" id="menuBtn" aria-label="Open menu"></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="gsearch" role="search">
          <span id="gIcon"></span>
          <input id="gq" type="search" placeholder="Search plate, customer, EST / INV no" aria-label="Search" autocomplete="off">
          <div class="gres" id="gres" hidden></div>
        </div>
        <div class="me" aria-hidden="true">ML</div>
      </header>
      <main id="view" aria-live="polite"></main>
    </div>
    <nav class="bottom" id="bottom" aria-label="Quick menu"></nav>
  </div>
  <div id="login" hidden></div>
  <div id="toast" role="status"></div>

  <script src="condition.js"></script>
  <script src="app.js"></script>
</body>
</html>
